<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CyberGuard Shield</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --safe: #238636;
      --warn: #d29922;
      --danger: #da3633;
      --accent: #58a6ff;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .header span {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .url-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      word-break: break-all;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      display: none;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-safe { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }
    .badge-suspicious { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid #d29922; }
    .badge-malicious { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid #da3633; }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .score-val {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
    }
    .indicators {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
    }
    .indicators ul {
      margin: 4px 0 0 0;
      padding-left: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>AI CyberGuard</h1>
      <span>Privacy Shield · Active Tab</span>
    </div>
  </div>

  <div id="urlDisplay" class="url-box">Detecting current tab URL...</div>
  <button id="scanBtn" class="btn">Inspect URL Defensively</button>

  <div id="resultBox" class="result">
    <div class="score-row">
      <span id="badgeClass" class="badge">SAFE</span>
      <div>
        <span style="font-size: 10px; color: var(--muted); margin-right: 4px;">Risk Score:</span>
        <span id="scoreVal" class="score-val">0</span>
      </div>
    </div>
    <div id="summaryText" style="font-size: 11px; margin-top: 6px; line-height: 1.4;"></div>
    <div id="indicatorsSection" class="indicators" style="display: none;">
      <strong>Detected Indicators:</strong>
      <ul id="indicatorsList"></ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
