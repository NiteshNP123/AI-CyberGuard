openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Defensive AI CyberGuard security operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: analysis
  - name: alerts
  - name: settings
paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace and user settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update workspace and user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get security posture summary
      responses:
        "200":
          description: Current dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/events:
    get:
      operationId: getRecentEvents
      tags: [dashboard]
      summary: Get recent security events
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
  /analysis/url:
    post:
      operationId: analyzeUrl
      tags: [analysis]
      summary: Analyze a user-provided URL defensively
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlAnalysisInput"
      responses:
        "200":
          description: URL assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
  /analysis/message:
    post:
      operationId: analyzeMessage
      tags: [analysis]
      summary: Analyze user-provided message text for fraud signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageAnalysisInput"
      responses:
        "200":
          description: Message assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List security alerts
      responses:
        "200":
          description: Security alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Classification:
      type: string
      enum: [SAFE, SUSPICIOUS, MALICIOUS, UNKNOWN]
    DashboardSummary:
      type: object
      properties:
        securityScore: { type: number, minimum: 0, maximum: 100 }
        threatLevel: { $ref: "#/components/schemas/Severity" }
        critical: { type: number }
        high: { type: number }
        medium: { type: number }
        low: { type: number }
        totalScans: { type: number }
        protectedAssets: { type: number }
        scoreTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        distribution:
          type: array
          items:
            $ref: "#/components/schemas/DistributionPoint"
      required: [securityScore, threatLevel, critical, high, medium, low, totalScans, protectedAssets, scoreTrend, distribution]
    TrendPoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
      required: [label, value]
    DistributionPoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
        color: { type: string }
      required: [label, value, color]
    SecurityEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        score: { type: number }
        timestamp: { type: string, format: date-time }
        source: { type: string }
      required: [id, type, title, detail, severity, score, timestamp, source]
    Alert:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        score: { type: number }
        status:
          type: string
          enum: [NEW, INVESTIGATING, RESOLVED, FALSE_POSITIVE]
        timestamp: { type: string, format: date-time }
        description: { type: string }
      required: [id, title, source, severity, score, status, timestamp, description]
    UrlAnalysisInput:
      type: object
      properties:
        url: { type: string, minLength: 3 }
      required: [url]
    MessageAnalysisInput:
      type: object
      properties:
        message: { type: string, minLength: 10 }
      required: [message]
    AnalysisResult:
      type: object
      properties:
        id: { type: string }
        classification: { $ref: "#/components/schemas/Classification" }
        riskScore: { type: number, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 100 }
        summary: { type: string }
        indicators:
          type: array
          items:
            type: string
        signals:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisSignal"
        recommendation: { type: string }
        analyzedAt: { type: string, format: date-time }
      required: [id, classification, riskScore, confidence, summary, indicators, signals, recommendation, analyzedAt]
    AnalysisSignal:
      type: object
      properties:
        name: { type: string }
        detail: { type: string }
        weight: { type: number }
      required: [name, detail, weight]
    Settings:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        workspaceName: { type: string }
        notificationEmail: { type: string }
        criticalAlerts: { type: boolean }
        weeklyDigest: { type: boolean }
        dataRetention: { type: string }
        scanConfirmation: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required: [id, name, workspaceName, notificationEmail, criticalAlerts, weeklyDigest, dataRetention, scanConfirmation]
    UpdateSettingsInput:
      type: object
      properties:
        name: { type: string }
        workspaceName: { type: string }
        notificationEmail: { type: string }
        criticalAlerts: { type: boolean }
        weeklyDigest: { type: boolean }
        dataRetention: { type: string }
        scanConfirmation: { type: boolean }